apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: vr-match-api
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: vr-match-api
    spec:
      containers:
      - name: vr-match-api
        image: gcr.io/${PROJECT_ID}/vr-match-api:${REVISION_ID}
        ports:
        - containerPort: 8080
        env:
          - name: VR_MATCH_API_MY_WEBAPP_PORT
            value: "8080"
          - name: VR_MATCH_API_EXAMPLE_PORT
            value: "8000"
          - name: VR_MATCH_CLIENT_ORIGIN
            value: "https://vr-match.boxp.tk"
      - name: cloudsql-proxy
        image: gcr.io/cloudsql-docker/gce-proxy:1.11
        command: ["/cloud_sql_proxy",
                  "-instances=boxp-tk:asia-northeast1:vr-match-staging=tcp:3306",
                  "-credential_file=/secrets/cloudsql/credentials.json"]
        securityContext:
          runAsUser: 2 # non-root user
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: cloudsql-instance-credentials
            mountPath: /secrets/cloudsql
            readOnly: true
