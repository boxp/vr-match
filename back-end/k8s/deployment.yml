apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  name: vr-match-back-end
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: vr-match-back-end
    spec:
      containers:
      - name: vr-match-back-end
        image: gcr.io/${PROJECT_ID}/vr-match-back-end:${REVISION_ID}
        ports:
        - containerPort: 8080
        env:
          - name: VR_MATCH_BACK_END_MY_WEBAPP_PORT
            value: "8080"
          - name: VR_MATCH_BACK_END_EXAMPLE_PORT
            value: "8000"
          - name: VR_MATCH_CLIENT_ORIGIN
            value: "https://vr-match.boxp.tk"
          - name: VR_MATCH_FIREBASE_SERVICE_ACCOUNT_KEY
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_SERVICE_ACCOUNT_KEY
          - name: VR_MATCH_MYSQL_DBNAME
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: MYSQL_DBNAME
          - name: VR_MATCH_MYSQL_USER
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: MYSQL_USER
          - name: VR_MATCH_MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: MYSQL_PASSWORD
          - name: FIREBASE_API_KEY
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_API_KEY
          - name: FIREBASE_AUTH_DOMAIN
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_AUTH_DOMAIN
          - name: FIREBASE_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_DATABASE_URL
          - name: FIREBASE_PROJECT_ID
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_PROJECT_ID
          - name: FIREBASE_STORAGE_BUCKET
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_STORAGE_BUCKET
          - name: FIREBASE_MESSAGING_SENDER_ID
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_MESSAGING_SENDER_ID
          - name: FIREBASE_APP_ID
            valueFrom:
              secretKeyRef:
                name: vr-match-staging-secrets
                key: FIREBASE_APP_ID
      - name: cloudsql-proxy
        image: gcr.io/cloudsql-docker/gce-proxy:1.11
        command: ["/cloud_sql_proxy",
                  "-instances=boxp-tk:asia-northeast1:vr-match-staging=tcp:3306",
                  "-credential_file=/secrets/cloudsql/credentials.json"]
        securityContext:
          runAsUser: 2 # non-root user
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: cloudsql-instance-credentials
            mountPath: /secrets/cloudsql
            readOnly: true
      volumes:
        - name: cloudsql-instance-credentials
          secret:
            secretName: vr-match-staging-cloudsql-instance-credentials
