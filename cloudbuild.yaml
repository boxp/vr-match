
steps:

# Build
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/vr-match-${_ENVIRONMENT}:$REVISION_ID', '-f', './front-end/Dockerfile', './front-end' ]
  id: 'build-front-end'
  waitFor: ['-']
- name: 'gcr.io/cloud-builders/docker'
  args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/vr-match-back-end-${_ENVIRONMENT}:$REVISION_ID', '-f', './back-end/Dockerfile', './back-end' ]
  id: 'build-back-end'
  waitFor: ['-']

# Push
- name: 'gcr.io/cloud-builders/docker'
  args: ["push", "gcr.io/$PROJECT_ID/vr-match-${_ENVIRONMENT}:$REVISION_ID"]
  id: 'push-front-end'
  waitFor: ['build-front-end']
- name: 'gcr.io/cloud-builders/docker'
  args: ["push", "gcr.io/$PROJECT_ID/vr-match-back-end-${_ENVIRONMENT}:$REVISION_ID"]
  id: 'push-back-end'
  waitFor: ['build-back-end']

# Apply environment variable
- name: 'loicmahieu/alpine-envsubst'
  entrypoint: 'sh'
  env:
  - "REVISION_ID=$REVISION_ID"
  - "PROJECT_ID=$PROJECT_ID"
  - "_ENVIRONMENT=$_ENVIRONMENT"
  - "_REPLICAS=$_REPLICAS"
  id: 'apply-env'
  waitFor: ['push-front-end', 'push-back-end']
  args:
  - '-c'
  - |
    envsubst < front-end/k8s/deployment.yml > front-end-deployment.yml
    envsubst < front-end/k8s/service.yml > front-end-service.yml
    envsubst < back-end/k8s/deployment.yml > back-end-deployment.yml
    envsubst < back-end/k8s/service.yml > back-end-service.yml

# Deploy
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  waitFor: ['apply-env']
  args:
  - '-c'
  - |
    gcloud config set container/use_client_certificate True
    gcloud container clusters get-credentials alice --zone asia-northeast1-a
    kubectl apply -f front-end-deployment.yml
    kubectl apply -f front-end-service.yml
    kubectl apply -f back-end-deployment.yml
    kubectl apply -f back-end-service.yml

options:
  machineType: 'N1_HIGHCPU_8'
