name: Build and Push Frontend Docker image to Stage ECR

on:
  workflow_dispatch:
  push:
    branches:
      - stage
    paths:
        - .github/workflows/stage-build-container-image-front-end.yml
        - front-end/**
  pull_request:
    types: [closed]
    branches:
      - stage
    paths:
        - .github/workflows/stage-build-container-image-front-end.yml
        - front-end/**
  repository_dispatch:
    types: [stage-deploy-frontend]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run this job when:
    # 1. It's a direct push to stage branch
    # 2. It's a PR that was merged (not just closed)
    # 3. It's a repository_dispatch event
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    permissions:
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ap-northeast-1
        role-to-assume: 'arn:aws:iam::839695154978:role/hitohub-stage-gha-role'

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      working-directory: ./front-end
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: hitohub-frontend-stage
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
