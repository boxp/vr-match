name: Docker Build Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  file-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          filters: |
            frontend:
              - 'front-end/**'
            backend:
              - 'back-end/**'
            workflow:
              - '.github/workflows/docker-build-check.yml'

  build-frontend:
    name: Build Frontend Docker Image
    needs: file-changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.file-changes.outputs.frontend == 'true' ||
      needs.file-changes.outputs.workflow == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front-end
          push: false
          load: true
          tags: vr-match-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build success
        run: |
          if [ "$(docker images -q vr-match-frontend:test 2> /dev/null)" == "" ]; then
            echo "Frontend Docker build failed"
            exit 1
          fi
          echo "Frontend Docker build succeeded"
  build-backend:
    name: Build Backend Docker Image
    needs: file-changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.file-changes.outputs.backend == 'true' ||
      needs.file-changes.outputs.workflow == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./back-end
          push: false
          load: true
          tags: vr-match-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build success
        run: |
          if [ "$(docker images -q vr-match-backend:test 2> /dev/null)" == "" ]; then
            echo "Backend Docker build failed"
            exit 1
          fi
          echo "Backend Docker build succeeded" 
